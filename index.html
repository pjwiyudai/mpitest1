<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12324B">
<meta name="description" content="Media Pembelajaran Interaktif Bahasa Inggris Kelas VII — TP 7.4 My Family / My Friends and I. Lima permainan, berjalan tanpa internet.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%2312324B%22/%3E%3Ccircle cx=%2232%22 cy=%2230%22 r=%2214%22 fill=%22%23D9A47A%22/%3E%3Cpath d=%22M18 28 Q18 14 32 14 Q46 14 46 28 Q40 20 32 20 Q24 20 18 28Z%22 fill=%22%231E1611%22/%3E%3Ccircle cx=%2227%22 cy=%2231%22 r=%222.2%22 fill=%22%23151515%22/%3E%3Ccircle cx=%2237%22 cy=%2231%22 r=%222.2%22 fill=%22%23151515%22/%3E%3Cpath d=%22M27 37 Q32 41 37 37%22 stroke=%22%237A3B2E%22 stroke-width=%222%22 fill=%22none%22/%3E%3Crect x=%2218%22 y=%2246%22 width=%2228%22 height=%228%22 rx=%224%22 fill=%22%237FD3E6%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192.png">
<title>MPI TP 7.4 My Family</title>
<style>
:root{
  --navy:#12324B; --teal:#0E7490; --teal-dark:#0B5566; --sky:#7FD3E6;
  --paper:#EEF4F7; --card:#FFFFFF; --ink:#1F2A33; --muted:#5B6B75; --line:#C9D6DD;
  --sun:#F2B33D; --sun-soft:#FDF1D6; --rose:#C8466A; --rose-soft:#F9E1E8;
  --ok:#23885A; --ok-soft:#DDF3E8; --bad:#C2413B; --bad-soft:#FBE3E1;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --font:"Trebuchet MS","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --en:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:clamp(16px,1.15vw + 11px,22px);line-height:1.45;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.hide{display:none!important}
.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(14px,2.5vw,36px)}

/* ---------- top bar ---------- */
.bar{background:var(--navy);color:#fff}
.bar .wrap{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.bar h1{font-size:1.05em;margin:0;font-weight:700;flex:1 1 auto;min-width:0}
.bar h1 small{display:block;font-weight:400;color:var(--sky);font-size:.72em}
.chipbtn{background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:.4em .9em;font-size:.8em;display:inline-flex;align-items:center;gap:.4em;white-space:nowrap}
.chipbtn:hover{background:rgba(255,255,255,.2)}
.chipbtn[aria-pressed="true"]{background:var(--sky);color:var(--navy);font-weight:700}

/* ---------- home ---------- */
.hero{background:var(--navy);color:#fff;padding:clamp(18px,3vw,40px) 0 clamp(70px,8vw,110px);position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(16px,3vw,48px);align-items:center}
.hero h2{font-size:clamp(30px,4.2vw,64px);line-height:1.02;margin:.1em 0 .25em;letter-spacing:-.01em}
.hero p{margin:0;color:#D4E7EE;max-width:34em}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.2vw,16px)}
.album figure{margin:0;background:#fff;border-radius:16px;padding:8px 8px 6px;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.album figure:nth-child(odd){transform:rotate(-2.5deg)}
.album figure:nth-child(even){transform:rotate(2deg) translateY(10px)}
.album svg{display:block;width:100%;height:auto;border-radius:10px}
.album figcaption{color:var(--navy);font-family:var(--en);font-weight:700;font-size:.72em;text-align:center;padding-top:4px}

.modes{display:flex;gap:10px;flex-wrap:wrap;margin-top:1.1em}
.toggle{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:4px}
.toggle button{padding:.45em 1em;border-radius:999px;color:#fff;font-size:.85em}
.toggle button[aria-pressed="true"]{background:#fff;color:var(--navy);font-weight:700}

.path{margin-top:calc(-1 * clamp(52px,6vw,84px));position:relative;z-index:2;display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(10px,1.4vw,18px);padding-bottom:28px}
.meet{background:var(--card);border-radius:var(--r-lg);padding:clamp(14px,1.4vw,22px);text-align:left;display:flex;flex-direction:column;gap:.45em;border:2px solid transparent;box-shadow:0 4px 0 var(--line);transition:transform .15s,border-color .15s}
.meet:hover{border-color:var(--teal);transform:translateY(-3px)}
.meet .num{display:flex;align-items:center;gap:.5em;color:var(--teal);font-weight:700;font-size:.82em}
.meet .num b{display:inline-grid;place-items:center;width:2em;height:2em;border-radius:50%;background:var(--teal);color:#fff;font-size:1em}
.meet h3{margin:.1em 0 0;font-family:var(--en);font-size:1.15em;color:var(--navy);line-height:1.15}
.meet p{margin:0;color:var(--muted);font-size:.82em}
.meet .go{margin-top:auto;padding-top:.5em;font-weight:700;color:var(--teal-dark);font-size:.85em}

.guide{background:var(--card);border-radius:var(--r-lg);padding:clamp(16px,2vw,28px);margin-bottom:36px;border:2px solid var(--line)}
.guide h3{margin:0 0 .4em;color:var(--navy)}
.guide table{width:100%;border-collapse:collapse;font-size:.82em}
.guide th,.guide td{text-align:left;vertical-align:top;padding:.55em .6em;border-top:1px solid var(--line)}
.guide th{color:var(--navy);width:13%}
.guide .note{color:var(--muted);font-size:.8em;margin:.8em 0 0}
.guide ul{margin:.3em 0 0;padding-left:1.2em}

/* ---------- game shell ---------- */
.game{padding:clamp(12px,2vw,26px) 0 40px}
.ghead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:14px}
.ghead h2{margin:0;font-family:var(--en);color:var(--navy);font-size:clamp(22px,2.4vw,36px);line-height:1.1;flex:1 1 auto}
.ghead h2 small{display:block;font-family:var(--font);color:var(--teal);font-size:.5em;font-weight:700}
.back{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:.45em 1em;font-weight:700;color:var(--navy)}
.back:hover{border-color:var(--navy)}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em}
.board{display:flex;gap:8px}
.team{border-radius:var(--r-md);padding:.35em .8em;display:flex;align-items:center;gap:.5em;font-weight:700;border:3px solid transparent;background:var(--card)}
.team .s{font-size:1.4em;font-variant-numeric:tabular-nums}
.team.a{color:#8A5A00;background:var(--sun-soft)}
.team.b{color:var(--rose);background:var(--rose-soft)}
.team.on.a{border-color:var(--sun)}
.team.on.b{border-color:var(--rose)}
.solo{background:var(--card);border-radius:var(--r-md);padding:.35em .9em;font-weight:700;color:var(--teal-dark)}
.solo .s{font-size:1.3em;font-variant-numeric:tabular-nums}

.task{background:var(--card);border-radius:var(--r-lg);padding:.8em 1.1em;margin-bottom:14px;display:flex;gap:.8em;align-items:flex-start;border-left:8px solid var(--teal)}
.task p{margin:0}
.task .en{font-family:var(--en);color:var(--muted);font-size:.82em}
.turn{margin-left:auto;white-space:nowrap;font-weight:700;padding:.3em .8em;border-radius:999px;font-size:.85em}
.turn.a{background:var(--sun);color:#3E2A00}
.turn.b{background:var(--rose);color:#fff}

.progress{height:10px;background:#fff;border-radius:999px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}

.btn{background:var(--teal);color:#fff;border-radius:var(--r-md);padding:.7em 1.4em;font-weight:700;font-size:1em;box-shadow:0 4px 0 var(--teal-dark)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--teal-dark)}
.btn[disabled]{background:#9DB3BC;box-shadow:0 4px 0 #81979F;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--navy);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;align-items:center}
.say{display:inline-grid;place-items:center;width:2.1em;height:2.1em;border-radius:50%;background:var(--paper);color:var(--teal-dark);flex:none}
.say:hover{background:var(--sky)}
.say svg{width:1.1em;height:1.1em}
.feedback{border-radius:var(--r-md);padding:.7em 1em;margin-top:12px;font-size:.95em}
.feedback.ok{background:var(--ok-soft);color:#14573A}
.feedback.bad{background:var(--bad-soft);color:#7A231F}

/* P1 match */
.words{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:0 calc(-1 * clamp(14px,2.5vw,36px)) 16px;padding:10px clamp(14px,2.5vw,36px);position:sticky;top:0;z-index:5;background:var(--paper)}
.word{font-family:var(--en);font-weight:700;font-size:1.25em;background:var(--card);border:3px solid var(--line);border-radius:var(--r-md);padding:.4em .9em;color:var(--navy);box-shadow:0 4px 0 var(--line)}
.word.sel{border-color:var(--teal);background:#E2F4F8;box-shadow:0 4px 0 var(--teal)}
.word.used{opacity:.25;pointer-events:none}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,42vw),1fr));gap:14px}
.pic{background:var(--card);border-radius:var(--r-lg);padding:10px;border:3px solid var(--line);display:flex;flex-direction:column;align-items:stretch;gap:6px;position:relative}
.pic svg{width:100%;height:auto;display:block;border-radius:14px}
.pic .tag{position:absolute;top:10px;left:10px;background:var(--navy);color:#fff;border-radius:8px;padding:0 .45em;font-weight:700;font-size:.8em}
.pic .ans{min-height:2.4em;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--en);font-weight:700;color:var(--ok);text-align:center;line-height:1.15}
.pic .ans small{font-family:var(--font);color:var(--muted);font-weight:400;font-size:.8em}
.pic.done{border-color:var(--ok);background:var(--ok-soft)}
.pic.ready{border-style:dashed;border-color:var(--teal)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.flashbad{border-color:var(--bad)!important;background:var(--bad-soft)!important}

/* P2 label */
.textcard{background:var(--card);border-radius:var(--r-lg);padding:clamp(14px,2vw,26px);border:2px solid var(--line)}
.textcard h3{font-family:var(--en);margin:0 0 .6em;color:var(--navy);display:flex;align-items:center;gap:.5em}
.srow{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:center;padding:.55em 0;border-top:1px dashed var(--line)}
.srow:first-of-type{border-top:0}
.sent{font-family:var(--en);font-size:1.2em;font-weight:600}
.lab{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.lab button{border:3px solid var(--line);border-radius:var(--r-sm);padding:.3em .7em;font-weight:700;font-size:.85em;background:#fff}
.lab button[aria-pressed="true"].i{background:var(--sun);border-color:var(--sun);color:#3E2A00}
.lab button[aria-pressed="true"].d{background:var(--sky);border-color:var(--sky);color:var(--navy)}
.srow .mark{grid-column:2 / 4;font-size:.85em}
.srow.ok .mark{color:var(--ok)}
.srow.bad .mark{color:var(--bad)}
.srow.ok .sent{color:var(--ok)}
.srow.bad .sent{color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85em;margin-bottom:12px}
.legend span{display:inline-flex;gap:.4em;align-items:center}
.legend i{width:1em;height:1em;border-radius:4px;display:inline-block}

/* P3 build */
.build{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.zone{background:var(--card);border-radius:var(--r-lg);padding:14px;border:2px solid var(--line);min-height:200px}
.zone h4{margin:0 0 .5em;color:var(--navy);font-size:.95em}
.slot{display:flex;gap:10px;align-items:center;border:3px dashed var(--line);border-radius:var(--r-md);padding:.5em .7em;margin-bottom:8px;min-height:3.1em}
.slot b{display:inline-grid;place-items:center;width:1.8em;height:1.8em;border-radius:50%;background:var(--paper);color:var(--navy);flex:none}
.slot.first b{background:var(--sun);color:#3E2A00}
.slot .stext{font-family:var(--en);font-weight:600;font-size:1.1em;flex:1}
.slot.filled{border-style:solid;border-color:var(--teal);cursor:pointer}
.slot.ok{border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-color:var(--bad);background:var(--bad-soft)}
.pool .piece{display:block;width:100%;text-align:left;font-family:var(--en);font-weight:600;font-size:1.1em;background:var(--paper);border:3px solid var(--line);border-radius:var(--r-md);padding:.55em .8em;margin-bottom:8px;box-shadow:0 3px 0 var(--line)}
.pool .piece:hover{border-color:var(--teal)}
.hint{color:var(--muted);font-size:.82em;margin:.2em 0 .6em}

/* P4 / P5 quiz */
.qcard{background:var(--card);border-radius:var(--r-lg);padding:clamp(16px,2.4vw,32px);border:2px solid var(--line)}
.qnum{color:var(--teal);font-weight:700;font-size:.85em}
.qtext{font-family:var(--en);font-size:clamp(24px,2.6vw,42px);font-weight:700;color:var(--navy);margin:.2em 0 .1em;line-height:1.2}
.qtext .gap{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--teal);text-align:center;color:var(--teal)}
.qclue{color:var(--muted);font-size:.9em;margin:0 0 .6em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px;margin-top:14px}
.opt{font-family:var(--en);font-weight:700;font-size:1.25em;background:var(--paper);border:3px solid var(--line);border-radius:var(--r-md);padding:.7em .8em;color:var(--navy);box-shadow:0 4px 0 var(--line);text-align:center}
.opt:hover{border-color:var(--teal)}
.opt.long{font-size:1.05em;text-align:left}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:#14573A}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:#7A231F}
.opt[disabled]{cursor:default}

/* P5 */
.steps{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.steps button{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:.4em 1em;font-weight:700;color:var(--muted)}
.steps button[aria-current="step"]{border-color:var(--teal);color:var(--teal-dark);background:#E2F4F8}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px;margin:10px 0}
.charc{background:var(--paper);border:3px solid var(--line);border-radius:var(--r-lg);padding:10px;text-align:left;display:flex;flex-direction:column;justify-content:flex-start}
.charc[aria-pressed="true"]{border-color:var(--teal);background:#E2F4F8}
.charc svg{width:100%;height:auto;border-radius:12px;display:block}
.charc strong{display:block;font-family:var(--en);color:var(--navy);margin-top:6px}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.kw span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:.1em .6em;font-family:var(--en);font-size:.85em}
.frames{background:var(--sun-soft);border-radius:var(--r-md);padding:.7em 1em;margin-top:10px;font-family:var(--en)}
.frames p{margin:.15em 0}
.frames em{font-family:var(--font);color:var(--muted);font-size:.85em;font-style:normal}
.rec{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:14px 0}
.recbtn{width:5.2em;height:5.2em;border-radius:50%;background:var(--rose);color:#fff;font-weight:700;box-shadow:0 5px 0 #8E2A47;display:grid;place-items:center;text-align:center;line-height:1.1;font-size:.9em}
.recbtn.on{background:var(--navy);box-shadow:0 5px 0 #071826;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.rectime{font-size:1.8em;font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy)}
.checks label{display:flex;gap:.7em;align-items:flex-start;background:var(--paper);border-radius:var(--r-md);padding:.6em .8em;margin-bottom:8px;cursor:pointer;border:2px solid transparent}
.checks input{width:1.4em;height:1.4em;flex:none;margin-top:.1em;accent-color:var(--teal)}
.checks label:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}

/* results */
.result{background:var(--card);border-radius:var(--r-lg);padding:clamp(20px,3vw,40px);text-align:center;border:2px solid var(--line)}
.stars{font-size:clamp(40px,5vw,72px);letter-spacing:.1em;color:var(--sun);line-height:1}
.stars .off{color:#D9E3E8}
.result h3{font-size:clamp(24px,2.6vw,40px);margin:.3em 0 .1em;color:var(--navy)}
.result p{margin:.3em auto;max-width:36em;color:var(--muted)}
.result .actions{justify-content:center}

.foot{color:var(--muted);font-size:.75em;text-align:center;padding:10px 0 24px}

@media (max-width:900px){
  .hero .wrap{grid-template-columns:1fr}
  .album{max-width:460px}
  .path{grid-template-columns:repeat(2,1fr)}
  .build{grid-template-columns:1fr}
  .guide th{width:auto}
}
@media (max-width:560px){
  .path{grid-template-columns:1fr}
  .srow{grid-template-columns:auto 1fr}
  .lab{grid-column:1 / 3;justify-content:flex-start}
  .srow .mark{grid-column:1 / 3}
  .guide table,.guide tbody,.guide tr,.guide th,.guide td{display:block}
  .guide thead{display:none}
  .guide th{border-top:2px solid var(--line);padding-bottom:0;font-size:1.05em}
  .guide td{border-top:0;padding-top:.2em}
  .guide td::before{content:attr(data-label);display:block;font-weight:700;color:var(--teal-dark);font-size:.9em}
  .charc{display:grid;grid-template-columns:84px 1fr;gap:4px 12px;align-items:center}
  .charc svg{grid-row:1 / 3}
  .charc strong{margin-top:0}
  .pics{gap:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ====== tambahan v2 ====== */
.meet .exp{display:inline-block;align-self:flex-start;background:var(--sun-soft);color:#6B4700;border-radius:999px;padding:.1em .7em;font-size:.72em;font-weight:700}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:.45em 1.1em;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{border-color:var(--teal);color:var(--teal-dark);background:#E2F4F8}

/* P1 maker */
.maker{display:grid;grid-template-columns:minmax(260px,1fr) 1.25fr;gap:18px;align-items:start}
.mk-left{position:sticky;top:8px;display:flex;flex-direction:column;gap:12px}
.stagecard{background:var(--card);border-radius:var(--r-lg);border:2px solid var(--line);padding:12px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.stagecard .fig{width:clamp(120px,15vw,210px);background:#E2F4F8;border-radius:16px;overflow:hidden}
.stagecard .fig svg{display:block;width:100%;height:auto}
.desc{list-style:none;margin:0;padding:0}
.desc li{display:flex;gap:8px;align-items:flex-start;padding:.3em .4em;border-radius:10px;transition:background .3s}
.desc li.flash{background:var(--sun-soft)}
.desc .en{font-family:var(--en);font-weight:700;color:var(--navy);font-size:1.02em;line-height:1.25}
.desc .id{display:block;font-style:italic;color:var(--muted);font-size:.78em;font-weight:400}
.desc .say{width:1.8em;height:1.8em}
.groups{display:flex;flex-direction:column;gap:12px}
.grp{background:var(--card);border-radius:var(--r-md);border:2px solid var(--line);padding:10px 12px}
.grp h4{margin:0 0 .45em;font-size:.85em;color:var(--teal-dark)}
.optrow{display:flex;flex-wrap:wrap;gap:8px}
.ob{display:flex;align-items:center;gap:.5em;background:var(--paper);border:3px solid var(--line);border-radius:var(--r-md);padding:.35em .7em;min-height:2.9em}
.ob[aria-pressed="true"]{border-color:var(--teal);background:#E2F4F8}
.ob .ic{width:2.2em;height:2.2em;flex:none;display:block}
.ob .ic svg{width:100%;height:100%;display:block}
.ob .w{font-family:var(--en);font-weight:700;color:var(--navy);line-height:1.1}
.ob .w small{display:block;font-family:var(--font);color:var(--muted);font-weight:400;font-size:.72em}
.ob.iconly{padding:.35em}
.ob.iconly .ic{width:2.8em;height:2.8em}
.sw{width:2.1em;height:2.1em;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--teal)}
.namein{font:inherit;font-family:var(--en);font-weight:700;color:var(--navy);border:3px solid var(--line);border-radius:var(--r-md);padding:.35em .7em;width:9em;background:var(--paper)}
.namein:focus{outline:none;border-color:var(--teal)}
.saved{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.saved .sv{position:relative;width:86px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:4px;text-align:center;font-family:var(--en);font-weight:700;font-size:.75em;color:var(--navy)}
.saved .sv svg{width:100%;height:auto;display:block;background:#E2F4F8;border-radius:8px}
.saved .x{position:absolute;top:-8px;right:-8px;width:1.6em;height:1.6em;border-radius:50%;background:var(--bad);color:#fff;font-weight:700;line-height:1}
.chal{background:var(--card);border-radius:var(--r-lg);border:2px dashed var(--teal);padding:12px 14px}
.chal .big{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chal p{margin:.3em 0}
.chal .txt{font-family:var(--en);font-weight:700;color:var(--navy);font-size:1.1em}
.btn.sm{padding:.45em 1em;font-size:.9em}

/* kartu tokoh (grid) */
.cast{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.cc{position:relative;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:4px 4px 2px;text-align:center}
.cc svg{display:block;width:100%;height:auto;background:#E2F4F8;border-radius:12px}
.cc b{display:block;font-family:var(--en);color:var(--navy);font-size:.9em;padding:2px 0}
.cc.out{opacity:.35;filter:grayscale(1)}
.cc.out::after{content:"";position:absolute;inset:10% 12%;background:linear-gradient(45deg,transparent 46%,var(--bad) 46%,var(--bad) 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,var(--bad) 46%,var(--bad) 54%,transparent 54%)}
.cast.guess .cc:not(.out){border-color:var(--sun);box-shadow:0 0 0 3px var(--sun-soft)}
.cc.win{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok-soft);opacity:1;filter:none}
.cc.miss{border-color:var(--bad)}
.legend2{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.8em;color:var(--muted);margin:8px 0 0}
.legend2 span{display:inline-flex;align-items:center;gap:.35em}
.legend2 svg{width:1.6em;height:1.6em}
.legend2 b{font-family:var(--en);color:var(--navy)}

/* P2 detektif */
.det{display:grid;grid-template-columns:minmax(240px,0.9fr) 2fr;gap:16px;align-items:start}
.clues{background:var(--card);border:2px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;position:sticky;top:8px}
.clues h4{margin:0 0 .4em;color:var(--navy)}
.clues ol{margin:0;padding:0;list-style:none}
.clues li{display:flex;gap:8px;align-items:center;font-family:var(--en);font-weight:700;color:var(--navy);font-size:1.1em;padding:.35em 0;border-top:1px dashed var(--line)}
.clues li:first-child{border-top:0}
.clues li .n{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--sky);color:var(--navy);font-size:.75em;flex:none}
.clues li.new{animation:pop .35s}
@keyframes pop{0%{transform:scale(.96);background:var(--sun-soft)}100%{transform:none}}
.clues li.lock{color:#9DB3BC;font-weight:400;font-style:italic}
.pts{font-size:.85em;color:var(--muted);margin:.5em 0}
.pts b{color:var(--teal-dark);font-size:1.2em}
.kw{color:var(--teal-dark);text-decoration:underline;text-decoration-thickness:3px;text-decoration-color:var(--sun);text-underline-offset:3px}

/* P3 robot */
.fix{display:grid;grid-template-columns:minmax(200px,.7fr) 2fr;gap:16px;align-items:start}
.pcard{background:var(--card);border:2px solid var(--line);border-radius:var(--r-lg);padding:10px;text-align:center;position:sticky;top:8px}
.pcard > svg{width:100%;height:auto;display:block;background:#E2F4F8;border-radius:14px}
.pcard .legend2{justify-content:center}
.pcard b{font-family:var(--en);color:var(--navy);display:block;margin-top:4px}
.robo{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.robo > svg{width:clamp(64px,7vw,96px);height:auto;flex:none}
.bubble .say{vertical-align:middle;margin-left:.3em}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:.6em .9em;position:relative;font-size:.92em}
.bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:var(--line)}
.bubble::after{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--card)}
.rtext{background:var(--card);border:2px solid var(--line);border-radius:var(--r-lg);padding:8px 12px}
.rl{border-top:1px dashed var(--line);padding:.45em 0}
.rl:first-child{border-top:0}
.rl > button.line{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:.35em .4em;border-radius:10px}
.rl > button.line:hover{background:var(--paper)}
.rl .no{display:inline-grid;place-items:center;width:1.8em;height:1.8em;border-radius:50%;background:var(--paper);color:var(--navy);font-weight:700;flex:none}
.rl .tx{font-family:var(--en);font-weight:700;font-size:1.15em;color:var(--navy)}
.rl.fixed .tx{color:var(--ok)}
.rl.fixed .no{background:var(--ok);color:#fff}
.rl.checked .no{background:var(--sky)}
.rl .old{display:block;font-size:.75em;color:var(--bad);text-decoration:line-through;font-weight:400}
.rl .choices{display:flex;flex-wrap:wrap;gap:8px;padding:.4em 0 .2em 2.6em}
.rl .choices button{font-family:var(--en);font-weight:700;background:var(--paper);border:3px solid var(--line);border-radius:var(--r-md);padding:.4em .8em;color:var(--navy)}
.rl .choices button.keep{font-family:var(--font)}
.rl .why{padding:.2em 0 .1em 2.6em;font-size:.85em}
.rl .why.ok{color:var(--ok)}
.rl .why.bad{color:var(--bad)}
.counter{display:flex;gap:6px;align-items:center;font-weight:700;color:var(--navy);margin:10px 0}
.counter i{width:1.1em;height:1.1em;border-radius:50%;background:#D9E3E8;display:inline-block}
.counter i.on{background:var(--ok)}

/* P4 draw */
.draw{display:grid;grid-template-columns:minmax(260px,1fr) 1.4fr;gap:16px;align-items:start}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:sticky;top:8px}
.pair .pc{background:var(--card);border:2px solid var(--line);border-radius:var(--r-lg);padding:8px;text-align:center}
.pair .pc svg{width:100%;height:auto;display:block;background:#E2F4F8;border-radius:12px}
.pair .pc h5{margin:0 0 4px;font-size:.78em;color:var(--teal-dark)}
.pair .pc b{font-family:var(--en);color:var(--navy);display:block;min-height:1.3em}
.cmp{grid-column:1 / 3;background:var(--card);border:2px solid var(--line);border-radius:var(--r-lg);padding:8px 12px;font-size:.82em}
.cmp div{display:flex;gap:8px;padding:.18em 0;align-items:baseline}
.cmp .st{flex:none;width:1.3em;text-align:center;font-weight:700}
.cmp .ok{color:var(--ok)} .cmp .bad{color:var(--bad)} .cmp .wait{color:#9DB3BC}
.mytext{background:var(--card);border:2px solid var(--line);border-radius:var(--r-lg);padding:10px 14px;margin-bottom:12px}
.mytext h4{margin:0 0 .3em;color:var(--navy);font-size:.9em;display:flex;align-items:center;gap:.5em}
.mytext ol{margin:0;padding-left:1.4em;font-family:var(--en);font-weight:700;color:var(--navy)}
.mytext li{padding:.1em 0}
.mytext .empty{color:var(--muted);font-size:.85em;margin:0}
.line-build{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:3.4em;background:var(--card);border:3px dashed var(--teal);border-radius:var(--r-md);padding:8px 10px}
.line-build .tk{font-family:var(--en);font-weight:700;background:#E2F4F8;border:2px solid var(--teal);border-radius:10px;padding:.2em .6em;color:var(--navy)}
.line-build .ph{color:var(--muted);font-size:.85em}
.bank{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bank .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bank .row span.lbl{font-size:.72em;color:var(--muted);width:5.2em;flex:none}
.tile{font-family:var(--en);font-weight:700;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:.35em .65em;color:var(--navy);box-shadow:0 3px 0 var(--line)}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.robomsg{margin-top:10px}

/* P5 battle */
.bt{display:grid;grid-template-columns:minmax(250px,.9fr) 2fr;gap:16px;align-items:start}
.ctrl{background:var(--card);border:2px solid var(--line);border-radius:var(--r-lg);padding:14px;position:sticky;top:8px}
.ctrl h4{margin:0 0 .4em;color:var(--navy)}
.ctrl .rule{background:var(--sun-soft);border-radius:var(--r-md);padding:.55em .8em;font-size:.85em;margin:.6em 0}
.timer{font-size:clamp(40px,5vw,72px);font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1;margin:.15em 0}
.timer.low{color:var(--bad)}
.tick{display:flex;gap:.6em;align-items:flex-start;background:var(--paper);border-radius:var(--r-md);padding:.5em .7em;margin:.4em 0;cursor:pointer;font-size:.88em}
.tick input{width:1.3em;height:1.3em;accent-color:var(--teal);flex:none;margin-top:.1em}
.overlay{position:fixed;inset:0;background:rgba(18,50,75,.92);z-index:50;display:grid;place-items:center;padding:16px}
.overlay .sheet{background:var(--card);border-radius:24px;padding:16px;max-width:min(420px,92vw);width:100%;text-align:center}
.overlay .sheet svg{width:min(240px,60vw);height:auto;background:#E2F4F8;border-radius:16px}
.overlay .sheet h3{font-family:var(--en);color:var(--navy);margin:.2em 0}
.overlay .sheet p{margin:.2em 0;color:var(--muted);font-size:.9em}
.model{background:var(--ok-soft);border-radius:var(--r-md);padding:.7em 1em;margin-top:10px}
.model p{margin:.15em 0;font-family:var(--en);font-weight:700;color:#14573A}

@media (max-width:900px){
  .maker,.det,.fix,.draw,.bt{grid-template-columns:1fr}
  .mk-left,.clues,.pcard,.pair,.ctrl{position:static}
  .cast{grid-template-columns:repeat(4,1fr)}
  .pcard{display:grid;grid-template-columns:110px 1fr;align-items:center;text-align:left;gap:10px}
  .pcard .legend2{justify-content:flex-start}
}
@media (max-width:560px){
  .cast{grid-template-columns:repeat(3,1fr);gap:6px}
  .cc b{font-size:.78em}
  .mk-left{display:contents}
  .maker{gap:10px}
  .stagecard{position:sticky;top:0;z-index:6;box-shadow:0 6px 12px rgba(18,50,75,.15)}
  .stagecard{grid-template-columns:96px 1fr;padding:8px;gap:8px}
  .stagecard .fig{width:96px}
  .desc .en{font-size:.88em}
  .desc .id{font-size:.72em}
  .desc li{padding:.15em .3em}
  .bank .row span.lbl{width:100%}
}

/* ====== v3: kesiapan PID/IFP ====== */
html,body{overflow-x:hidden}
/* target sentuh dasar (semua layar) */
.chipbtn{min-height:44px}
.back{min-height:48px;min-width:48px}
.say{width:2.3em;height:2.3em;min-width:44px;min-height:44px}
.desc .say{width:2em;height:2em;min-width:40px;min-height:40px}
.ob{min-height:3em}
.tile{min-height:2.5em;min-width:2.6em}
.rl .choices button{min-height:2.6em}
.tick input,.checks input{width:1.6em;height:1.6em}
.tabs button{min-height:2.6em}
.sw{width:2.4em;height:2.4em}
.btn{min-height:2.8em}
.names .ob{min-height:2.5em}
.names .ob.on,.names .ob[aria-pressed="true"]{border-color:var(--teal);background:#E2F4F8}
.formatif{font-size:.8em;color:var(--muted);border-top:1px dashed var(--line);padding-top:.6em;margin-top:1em!important}

/* papan skor melayang (mode beregu) */
.floatboard{position:fixed;top:10px;right:10px;z-index:40;display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.96);border:2px solid var(--line);border-radius:18px;padding:6px 8px;box-shadow:0 6px 18px rgba(18,50,75,.18);pointer-events:none;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s}
.floatboard.show{opacity:1;transform:none}
.floatboard .team{padding:.2em .6em;font-size:.9em}
.floatboard .turn{font-size:.8em}

/* pesan singkat */
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);z-index:60;background:var(--navy);color:#fff;border-radius:16px;padding:.7em 1.1em;max-width:min(640px,92vw);font-size:.9em;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ====== layar besar: PID/IFP 1920 ke atas ====== */
/* juga berlaku untuk layar sentuh besar (PID/IFP) yang dijalankan dengan skala tampilan tinggi */
@media (min-width:1800px), (pointer:coarse) and (min-width:1400px){
  body{font-size:26px}
  .wrap{max-width:1720px}
  .bar .wrap{min-height:84px}
  .bar h1{font-size:1.15em}
  .chipbtn{min-height:60px;padding:.4em 1.2em;font-size:.85em}
  .back{min-height:64px;padding:.4em 1.3em}
  .say{min-width:64px;min-height:64px}
  .desc .say{min-width:56px;min-height:56px}
  .btn{min-height:64px;padding:.6em 1.5em}
  .btn.sm{min-height:60px}
  .ob{min-height:72px;padding:.4em .9em}
  .ob.iconly .ic{width:3.2em;height:3.2em}
  .tile{min-height:64px;min-width:64px;font-size:1.05em}
  .tabs button{min-height:64px}
  .rl .choices button{min-height:64px}
  .rl > button.line{min-height:64px}
  .tick,.checks label{min-height:64px;align-items:center}
  .tick input,.checks input{width:36px;height:36px}
  .sw{width:56px;height:56px}
  .namein{min-height:60px}
  .toggle button{min-height:56px}
  .hero h2{font-size:80px}
  .ghead h2{font-size:46px}
  .team{padding:.4em 1em}
  .team .s{font-size:1.6em}
  .task{font-size:1.08em}
  .feedback{font-size:1em}
  .stagecard .fig{width:270px}
  .det,.bt{grid-template-columns:minmax(380px,.9fr) 2fr}
  .fix{grid-template-columns:minmax(300px,.7fr) 2fr}
  .cast{gap:16px}
  .cc b{font-size:1em}
  .robo > svg{width:120px}
  .timer{font-size:110px}
  .overlay .sheet{max-width:560px}
  .overlay .sheet svg{width:320px}
  .floatboard{top:16px;right:16px}
}
/* 4K pada skala 100%: perbesar seluruh tata letak secara merata */
@media (min-width:2600px){ html{zoom:1.4} }
@media (min-width:3400px){ html{zoom:2} }

/* ====== v3 7.4 — tombol putar & penghitung ====== */
.chal .big{align-items:center}
.playbtn.playing{background:var(--rose);border-color:var(--rose);box-shadow:0 4px 0 #9B3352}
.plays{font-size:.85em;font-weight:700;color:var(--teal-dark);background:#E2F4F8;border-radius:999px;padding:.2em .8em}
.bubble .say{vertical-align:middle;margin-right:.3em}
</style>

<body>
<header class="bar">
  <div class="wrap">
    <h1>Media Pembelajaran Interaktif (MPI)<small>Bahasa Inggris Kelas VII · TP 7.4 My Family / My Friends and I</small></h1>
    <button class="chipbtn" id="soundBtn" aria-pressed="true" title="Suara efek & pelafalan">Suara aktif</button>
    <button class="chipbtn" id="speedBtn" title="Kecepatan suara bahasa Inggris">Kecepatan: Pelan</button>
    <button class="chipbtn" id="fsBtn" title="Layar penuh">Layar penuh</button>
  </div>
</header>
<main id="app"></main>
<div id="floatBoard" class="floatboard" aria-hidden="true"></div>
<p class="foot">MPI TP 7.4 · Bersifat formatif dan opsional (±5–10 menit, menggantikan sebagian latihan). Bukan alat penilaian sumatif. Berjalan tanpa internet.</p>
<script>
(function(){
"use strict";
/* ===== MESIN TOKOH (tubuh penuh) ===== */
const SKIN = ['#F1C9A5','#D9A47A','#B97F56','#8D5A3B'];
const HAIRC = { black:'#1E1611', brown:'#8A5A2B', white:'#E4E7EA' };
const EYEC = { brown:'#7A4A22', black:'#151515' };
function chibi(t, opt){
  t = t || {}; opt = opt || {};
  const unknown = !!opt.unknown;
  const skin = unknown ? '#C9D6DD' : SKIN[t.skin==null?1:t.skin];
  const shirt = unknown ? '#9DB3BC' : (t.shirt || '#0E7490');
  const pants = unknown ? '#81979F' : '#12324B';
  const H = t.h==='tall' ? 132 : t.h==='short' ? 90 : 111;
  const R = 17, cx = 60, floor = 152;
  const top = floor - H, cy = top + R;
  const bodyTop = cy + R - 3;
  const legLen = Math.max(18, (H - 2*R) * 0.38);
  const bodyBot = floor - legLen;
  const hc = t.hc ? HAIRC[t.hc] : '#1E1611';
  const hcStroke = t.hc==='white' ? ' stroke="#A9B2B8" stroke-width="1"' : '';
  const bg = opt.bg || 'transparent';
  let s = `<svg viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">`;
  if(bg!=='transparent') s += `<rect width="120" height="160" fill="${bg}"/>`;
  if(opt.ref!==false){
    s += `<line x1="4" x2="116" y1="${floor-111}" y2="${floor-111}" stroke="#9DB3BC" stroke-width="1.2" stroke-dasharray="4 4"/>`;
  }
  s += `<rect x="0" y="${floor}" width="120" height="8" fill="#C9D6DD"/>`;
  // rambut belakang (panjang)
  if(t.hair==='long' && !unknown){
    s += `<path d="M${cx-R-1} ${cy} Q${cx-R-2} ${cy-R-3} ${cx} ${cy-R-3} Q${cx+R+2} ${cy-R-3} ${cx+R+1} ${cy} L${cx+R+5} ${bodyTop+22} Q${cx} ${bodyTop+28} ${cx-R-5} ${bodyTop+22} Z" fill="${hc}"${hcStroke}/>`;
  }
  // kaki
  s += `<rect x="47" y="${bodyBot-4}" width="10" height="${floor-bodyBot+4}" rx="4" fill="${pants}"/><rect x="63" y="${bodyBot-4}" width="10" height="${floor-bodyBot+4}" rx="4" fill="${pants}"/>`;
  // badan
  s += `<rect x="43" y="${bodyTop}" width="34" height="${bodyBot-bodyTop}" rx="10" fill="${shirt}"/>`;
  // lengan + pose sifat
  const midY = bodyTop + (bodyBot-bodyTop)*0.55;
  const handY = bodyTop + (bodyBot-bodyTop)*0.9;
  const arm = (x1,y1,x2,y2)=>`<path d="M${x1} ${y1} L${x2} ${y2}" stroke="${skin}" stroke-width="7" stroke-linecap="round"/>`;
  const pose = unknown ? null : t.s;
  if(pose==='friendly'){
    s += arm(45, bodyTop+6, 37, handY);
    s += arm(75, bodyTop+6, 90, cy-6);
    s += `<g><rect x="90" y="${Math.max(2,cy-34)}" width="26" height="17" rx="7" fill="#fff" stroke="#12324B" stroke-width="1.6"/><text x="103" y="${Math.max(2,cy-34)+12.5}" text-anchor="middle" font-family="Arial" font-weight="700" font-size="10" fill="#12324B">Hi!</text></g>`;
  } else if(pose==='kind'){
    s += arm(45, bodyTop+6, 56, midY);
    s += arm(75, bodyTop+6, 64, midY);
    s += `<path d="M66 ${midY-6} C66 ${midY-11} 60 ${midY-12} 60 ${midY-7} C60 ${midY-12} 54 ${midY-11} 54 ${midY-6} C54 ${midY-1} 60 ${midY+3} 60 ${midY+5} C60 ${midY+3} 66 ${midY-1} 66 ${midY-6}Z" fill="#E5677F" stroke="#fff" stroke-width="1.2"/>`;
  } else if(pose==='smart'){
    s += arm(45, bodyTop+6, 54, midY+2);
    s += arm(75, bodyTop+6, 66, midY+2);
    s += `<g><rect x="47" y="${midY-6}" width="26" height="17" rx="2" fill="#2E5E9E"/><line x1="60" y1="${midY-6}" x2="60" y2="${midY+11}" stroke="#fff" stroke-width="1.4"/><rect x="49" y="${midY-4}" width="9" height="13" fill="#F7F3E8"/><rect x="62" y="${midY-4}" width="9" height="13" fill="#F7F3E8"/></g>`;
  } else {
    s += arm(45, bodyTop+6, 37, handY);

/* ---- pelafalan (mesin suara v2) ----
   Prinsip kelas:
   1. Suara HANYA berbunyi bila tombol putar ditekan — tidak ada narasi otomatis.
   2. Dibacakan kalimat demi kalimat dengan JEDA di antaranya; kecepatan dapat diatur guru
      (Normal · Pelan · Sangat pelan). Bawaan: Pelan. */
const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
const SPEEDS = {
  normal: { rate: .92, gap: 350,  label: 'Normal' },
  pelan:  { rate: .80, gap: 800,  label: 'Pelan' },
  sangat: { rate: .70, gap: 1300, label: 'Sangat pelan' }
};
const SPEED_ORDER = ['pelan','sangat','normal'];
let enVoice = null;
const badVoices = new Set();
/* pilih suara bahasa Inggris yang paling enak didengar: suara "Natural"/Google lebih alami daripada suara sistem lama */
function pickVoice(){
  if(!canSpeak) return;
  const vs = speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang) && !badVoices.has(v.name));
  const score = v => (/natural/i.test(v.name)?6:0) + (/google/i.test(v.name)?4:0) + (/^en[-_](US|GB)/i.test(v.lang)?2:0) + (v.localService?1:0) - (/compact|espeak/i.test(v.name)?5:0);
  enVoice = vs.sort((a,b)=>score(b)-score(a))[0] || null;
}
if(canSpeak){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let ttsFailed = false, onTtsFail = null;
/* Suara siap dipakai? false bila: tidak didukung, dimatikan, pernah gagal, atau perangkat tidak punya suara bahasa Inggris */
function ttsReady(){
  if(!canSpeak || !S.sound || ttsFailed) return false;
  try{ const vs = speechSynthesis.getVoices(); if(vs.length && !enVoice) return false; }catch(e){ return false; }
  return true;
}
function splitSentences(text){
  const parts = String(text).match(/[^.!?]+[.!?]+["”’)]*\s*|[^.!?]+$/g);
  return (parts || [String(text)]).map(s=>s.trim()).filter(Boolean);
}
let speakToken = 0, nowPlaying = null;
const playListeners = new Set();
function notifyPlay(){ playListeners.forEach(fn=>{ try{ fn(nowPlaying); }catch(e){} }); }
function stopSpeak(){
  speakToken++;
  if(canSpeak) try{ speechSynthesis.cancel(); }catch(e){}
  if(nowPlaying !== null){ nowPlaying = null; notifyPlay(); }
}
/* speak(text, onend) — membaca per kalimat dengan jeda sesuai kecepatan */
function speak(text, onend){
  if(!S.sound || !canSpeak || ttsFailed) return false;
  speakToken++; const token = speakToken;
  try{ speechSynthesis.cancel(); }catch(e){}
  const parts = splitSentences(text), sp = SPEEDS[S.speed] || SPEEDS.pelan;
  nowPlaying = text; notifyPlay();
  let i = 0;
  const finishAll = ()=>{ if(token !== speakToken) return; nowPlaying = null; notifyPlay(); if(onend) onend(); };
  const next = ()=>{
    if(token !== speakToken) return;
    if(i >= parts.length) return finishAll();
    const line = parts[i++];
    let done = false, guard = null;
    const fin = ()=>{ if(done) return; done = true; clearTimeout(guard); if(token !== speakToken) return; if(i < parts.length) setTimeout(next, sp.gap); else finishAll(); };
    try{
      const u = new SpeechSynthesisUtterance(line);
      u.lang = enVoice ? enVoice.lang : 'en-US'; if(enVoice) u.voice = enVoice; u.rate = sp.rate;
      u.onend = fin;
      u.onerror = ev=>{
        if(ev && (ev.error==='interrupted' || ev.error==='canceled')){ done = true; clearTimeout(guard); return; }
        done = true; clearTimeout(guard);
        if(token !== speakToken) return;
        /* suara daring (mis. "Natural") gagal saat offline → pindah ke suara lain, ulangi kalimat ini */
        if(enVoice && !enVoice.localService && !badVoices.has(enVoice.name)){ badVoices.add(enVoice.name); pickVoice(); if(enVoice){ i--; next(); return; } }
        ttsFailed = true; nowPlaying = null; notifyPlay();
        toast('Suara perangkat tidak dapat dipakai. Teks ditampilkan — guru dapat membacakannya.'); if(onTtsFail) onTtsFail();
      };
      /* pengaman bila browser tidak mengirim onend */
      guard = setTimeout(fin, 4000 + line.split(/\s+/).length * 900 / sp.rate);
      speechSynthesis.speak(u);
    }catch(e){ ttsFailed = true; nowPlaying = null; notifyPlay(); if(onTtsFail) onTtsFail(); }
  };
  next();
  return true;
}

let actx = null;
function tone(freqs, dur, type){
  if(!S.sound) return;
  try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const t0 = actx.currentTime;
    freqs.forEach((f,i)=>{ const o = actx.createOscillator(), g = actx.createGain(); o.type = type || 'sine'; o.frequency.value = f;
      const st = t0 + i*dur*0.8; g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(0.18, st+0.02); g.gain.exponentialRampToValueAtTime(0.0001, st+dur);
      o.connect(g); g.connect(actx.destination); o.start(st); o.stop(st+dur+0.02); });
  }catch(e){}
}

const GROUPS = [
  { key:'g', label:'He atau She?', opts:[['she','She','perempuan'],['he','He','laki-laki']] },
  { key:'h', label:'Tinggi badan', opts:[['tall','tall','tinggi'],['short','short','pendek']] },

const NAMES_HE = ['Andi','Raka','Dimas','Bayu','Fajar','Rudi','Iwan','Arif'];
const CHALLENGES = [ withRel(castBy('Dimas'),'brother'), withRel(castBy('Tika'),'friend'), withRel(castBy('Rina'),'sister'), withRel(castBy('Raka'),'friend'), withRel(castBy('Lina'),'sister') ];
const KEYLABEL = { g:'He/She', h:'Tinggi badan', hair:'Rambut', hc:'Warna rambut', eyes:'Mata', s:'Sifat' };
const VALWORD = { she:'She', he:'He', tall:'tall', short:'short', long:'long hair', curly:'curly hair', black:'black', brown:'brown', white:'white', kind:'kind', friendly:'friendly', funny:'funny', smart:'smart' };

function startP1(){
  const m = MEETINGS[0];
  let mode = 'free';
  let t = { g:'she', rel:'friend', name:'Sari', h:'short', hair:'long', hc:'black', eyes:'brown', s:'kind', skin:1, shirt:'#C8466A' };
  let ci = 0, order = shuffle(CHALLENGES), tries = 0, userShow = false;
  newGame(1, {noScore:true});
  const st = shell(m, 'Rakit tokohmu: pilih ciri-cirinya. Dengarkan kalimat yang berubah setiap kali kamu memilih.', 'Make a character. Listen to the sentences.');

  function optBtn(g, o, iconOnly){
    const pressed = t[g.key]===o[0];
    const ic = g.key==='g' ? '' : `<span class="ic">${ICON[g.key](o[0])}</span>`;
    if(iconOnly && g.key!=='g') return `<button class="ob iconly" data-k="${g.key}" data-v="${o[0]}" aria-pressed="${pressed}" aria-label="${o[1]}">${ic}</button>`;
    return `<button class="ob" data-k="${g.key}" data-v="${o[0]}" aria-pressed="${pressed}">${ic}<span class="w">${o[1]}${iconOnly?'':`<small>${o[2]}</small>`}</span></button>`;
  }
  function draw(changed){
    const chal = mode==='chal';
    const C = chal ? order[ci] : null;
    const canHear = ttsReady();
    const showText = userShow || !canHear;
    onTtsFail = ()=>{ if(mode==='chal') draw(); };
    const relOpts = t.g==='he' ? [['friend','friend','teman'],['brother','brother','saudara laki-laki']] : [['friend','friend','teman'],['sister','sister','saudara perempuan']];
    if(!relOpts.some(o=>o[0]===t.rel)) t.rel = 'friend';
    const sens = sentences(t);
    const saved = store.get('chars', []);
    st.innerHTML = `
      <div class="tabs" role="tablist">
        <button role="tab" data-mode="free" aria-selected="${!chal}">Bebas berkreasi</button>
        <button role="tab" data-mode="chal" aria-selected="${chal}">Tantangan: dengar & buat</button>
      </div>
      <div class="maker">
        <div class="mk-left">
          ${chal ? `<div class="chal">
              <p><b>Tantangan ${ci+1} dari ${order.length}.</b> Dengarkan deskripsinya, lalu buat tokoh yang sama.</p>
              <div class="big">${canHear?`<button class="btn sm playbtn" id="hear" data-label="Putar deskripsi">▶ Putar deskripsi</button><span class="plays">Belum diputar</span><button class="btn ghost sm" id="showTxt">${showText?'Sembunyikan teks':'Tampilkan teks'}</button>`:''}</div>
              ${showText?`<p class="txt">${sentences(C).map(x=>esc(x.en)).join(' ')}</p>`:''}
              <p class="hint">${canHear ? 'Audio baru berbunyi setelah tombol <b>▶</b> ditekan — beri instruksi dulu. Dengarkan <b>dua kali</b>. Suara tidak terdengar? Tekan <b>Tampilkan teks</b>, atau guru membacakan deskripsinya.' : (S.sound ? 'Suara bahasa Inggris tidak tersedia di perangkat ini — guru membacakan teks di atas (2×), murid mendengarkan.' : 'Suara dimatikan, jadi teks ditampilkan. Guru dapat membacakannya (2×) agar tetap menjadi latihan menyimak.')}</p>
            </div>`:''}
          <div class="stagecard">
            <div class="fig">${chibi(t)}</div>
            ${chal ? `<div><p style="margin:0;font-family:var(--en);font-weight:700;color:var(--navy);font-size:1.2em">${esc(C.name)}</p><p class="hint">Tombol pilihan hanya bergambar — pahami arti kata yang kamu dengar.</p><div class="actions" style="margin-top:6px"><button class="btn" id="checkC">Cek tokohku</button></div></div>`
              : `<ul class="desc">${sens.map(x=>`<li data-k="${x.k}" class="${changed && changed===x.k?'flash':''}">${sayBtn(x.en)}<span class="en">${esc(x.en)}<span class="id">${esc(x.id)}</span></span></li>`).join('')}</ul>`}
          </div>
          <div id="fb"></div>
        </div>
        <div class="groups">
          ${chal ? '' : `<div class="grp"><h4>Siapa dia? (Identification)</h4><div class="optrow" style="align-items:center">
              <span class="w" style="font-family:var(--en);font-weight:700;color:var(--navy)">This is my</span>
              ${relOpts.map(o=>`<button class="ob" data-k="rel" data-v="${o[0]}" aria-pressed="${t.rel===o[0]}"><span class="w">${o[1]}<small>${o[2]}</small></span></button>`).join('')}
              <input class="namein" id="nm" value="${esc(t.name)}" maxlength="12" aria-label="Nama tokoh (boleh diketik)">
            </div>
            <div class="optrow names" style="margin-top:8px" aria-label="Pilih nama cepat">
              ${(t.g==='he'?NAMES_HE:NAMES_SHE).slice(0,4).map(n=>`<button class="ob nm ${t.name===n?'on':''}" data-name="${n}" aria-pressed="${t.name===n}"><span class="w">${n}</span></button>`).join('')}
              <button class="ob nm" data-name="__rand"><span class="w">🎲 Nama acak</span></button>
            </div></div>`}
          ${GROUPS.map(g=>`<div class="grp"><h4>${g.label}</h4><div class="optrow">${g.opts.map(o=>optBtn(g,o,chal)).join('')}</div></div>`).join('')}
          <div class="grp"><h4>Warna kulit & baju (hiasan)</h4><div class="optrow">
            ${SKIN.map((c,i)=>`<button class="sw" data-skin="${i}" style="background:${c}" aria-pressed="${t.skin===i}" aria-label="Warna kulit ${i+1}"></button>`).join('')}
            <span style="width:12px"></span>
            ${SHIRTS.map(c=>`<button class="sw" data-shirt="${c}" style="background:${c}" aria-pressed="${t.shirt===c}" aria-label="Warna baju"></button>`).join('')}
          </div></div>
          ${chal ? '' : `<div class="grp"><h4>Simpan tokoh (dipakai lagi di Describe to Draw)</h4>
            <div class="actions" style="margin-top:0"><button class="btn sm" id="save">Simpan tokoh ini</button>${sayBtn(sens.map(x=>x.en).join(' '))}<span class="hint" style="margin:0">Dengar deskripsi utuh</span></div>
            ${saved.length?`<div class="saved">${saved.map((c,i)=>`<div class="sv">${chibi(c,{ref:false})}${esc(c.name)}<button class="x" data-del="${i}" aria-label="Hapus ${esc(c.name)}">×</button></div>`).join('')}</div>`:''}
          </div>`}
        </div>
      </div>`;
    st.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
      if(b.dataset.mode===mode) return;
      mode = b.dataset.mode;
      if(mode==='chal'){
        newGame(1); G.total = order.length; renderBoardFull();
        ci = 0; order = shuffle(CHALLENGES); tries = 0;
        t = { g:null, rel:'friend', name:'', h:null, hair:null, hc:null, eyes:null, s:null, skin:1, shirt:'#0E7490' };
        setTask('Dengarkan deskripsi, lalu buat tokoh yang sama dengan menekan tombol bergambar. Tekan <b>Cek tokohku</b>.', 'Listen to the description and make the same character.');
        stopSpeak(); playCounts.clear(); userShow = false; draw();
      } else {
        stopSpeak(); newGame(1, {noScore:true}); renderBoardFull();
        t = { g:'she', rel:'friend', name:'Sari', h:'short', hair:'long', hc:'black', eyes:'brown', s:'kind', skin:1, shirt:'#C8466A' };
        setTask('Rakit tokohmu: pilih ciri-cirinya. Dengarkan kalimat yang berubah setiap kali kamu memilih.', 'Make a character. Listen to the sentences.');
        draw();
      }
    });
    st.querySelectorAll('.ob[data-k]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.k, v=b.dataset.v; t[k]=v;
      if(k==='g' && t.rel!=='friend') t.rel = v==='he' ? 'brother' : 'sister';
      if(k==='g' && mode==='free'){ const pool = v==='he' ? NAMES_HE : NAMES_SHE; if(!pool.includes(t.name) && (NAMES_HE.includes(t.name)||NAMES_SHE.includes(t.name))) t.name = pool[0]; }
      const key = (k==='hc') ? 'hair' : (k==='g'||k==='rel') ? 'ident' : k;
      draw(key);
      const nb = st.querySelector(`.ob[data-k="${k}"][data-v="${v}"]`); if(nb) nb.focus({preventScroll:true});
    });
    st.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>{
      const pool = t.g==='he' ? NAMES_HE : NAMES_SHE;
      let n = b.dataset.name;
      if(n==='__rand'){ const others = pool.filter(x=>x!==t.name); n = others[Math.floor(Math.random()*others.length)]; }
      t.name = n; draw('ident');
    });
    st.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{ t.skin=+b.dataset.skin; draw(); });
    st.querySelectorAll('[data-shirt]').forEach(b=>b.onclick=()=>{ t.shirt=b.dataset.shirt; draw(); });
    const nm = st.querySelector('#nm');
    if(nm){ nm.oninput = ()=>{ t.name = nm.value.replace(/[^A-Za-z '\-]/g,'').slice(0,12) || 'Sari'; const li = st.querySelector('.desc li[data-k="ident"] .en'); const s = sentences(t)[0]; if(li) li.innerHTML = `${esc(s.en)}<span class="id">${esc(s.id)}</span>`; const sb = st.querySelector('.desc li[data-k="ident"] .say'); if(sb) sb.setAttribute('data-say', s.en); }; nm.onchange = ()=>draw(); }
    const sv = st.querySelector('#save');
    if(sv) sv.onclick = ()=>{
      const list = store.get('chars', []);
      const c = Object.assign({}, t, {name: (t.name||'Sari').trim()});
      list.unshift(c); store.set('chars', list.slice(0,8));
      sfx.ok(); draw();
      st.querySelector('#fb').innerHTML = `<div class="feedback ok">Tokoh <b>${esc(c.name)}</b> tersimpan. Pakai di Pertemuan 4 (Describe to Draw).</div>`;
    };
    st.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const list = store.get('chars', []); list.splice(+b.dataset.del,1); store.set('chars', list); draw(); });
    const hear = st.querySelector('#hear');
    if(hear){ const txt = sentences(order[ci]).map(x=>x.en).join(' '); hear.__text = txt; paintPlay(hear);
      hear.onclick = ()=>{ if(nowPlaying === txt){ stopSpeak(); return; } playCounts.set(txt, (playCounts.get(txt)||0) + 1); speak(txt); paintPlay(hear); }; }
    const shw = st.querySelector('#showTxt'); if(shw) shw.onclick = ()=>{ userShow=!userShow; draw(); };
    const ck = st.querySelector('#checkC');
    if(ck) ck.onclick = ()=>{
      setTimeout(()=>{ const f=st.querySelector('#fb'); if(f && window.innerWidth<900) f.scrollIntoView({behavior:'smooth', block:'center'}); }, 30);
      const C = order[ci]; tries++;
      const keys = ['g','h','hair','hc','eyes','s'];
      const wrong = keys.filter(k=>t[k]!==C[k]);
      const fb = st.querySelector('#fb');
      if(!wrong.length){
        sfx.ok(); addPts(tries===1 || G.teamMode ? 1 : 0);
        fb.innerHTML = `<div class="feedback ok">Tepat! Tokohmu sama dengan deskripsi.<br><span style="font-family:var(--en)">${sentences(C).map(x=>esc(x.en)).join(' ')}</span></div>
          <div class="actions"><button class="btn" id="nextC">${ci<order.length-1?'Tantangan berikutnya':'Lihat hasil'}</button></div>`;
        fb.querySelector('#nextC').onclick = ()=>{
          ci++; tries = 0;
          if(ci>=order.length) return result(m, {detail:`Tokoh tepat pada percobaan pertama: <b>${G.score}</b> dari <b>${G.total}</b>`});
          t = { g:null, rel:'friend', name:'', h:null, hair:null, hc:null, eyes:null, s:null, skin:t.skin, shirt:t.shirt };
          stopSpeak(); playCounts.clear(); userShow = false; draw();
        };
      } else {
        sfx.bad(); G.mistakes++; if(G.teamMode){ G.turn = 1-G.turn; renderBoard(); }
        const unset = wrong.filter(k=>t[k]==null);
        fb.innerHTML = `<div class="feedback bad">Belum sama. Periksa: <b>${wrong.map(k=>KEYLABEL[k]).join(', ')}</b>.${unset.length?' Ada ciri yang belum kamu pilih.':''} Dengarkan lagi deskripsinya.</div>`;
      }
    };
  }
  function renderBoardFull(){ const b=document.getElementById('board'); if(b) b.outerHTML = boardHTML(); const tt=document.getElementById('turn'); if(tt) tt.outerHTML = turnHTML(); }
  draw();
}

/* =========================================================
   P2 — WHO IS IT? (DETEKTIF)
   ========================================================= */
function clueSet(c){
  const P = Pr(c), O = Po(c);
  return [
    { k:'h', en:`${P} is ${c.h}.`, test:x=>x.g===c.g && x.h===c.h, key:[P,c.h] },
    { k:'hair', en:`${P} has ${c.hair} hair.`, test:x=>x.g===c.g && x.hair===c.hair, key:[P,'has',c.hair] },
    { k:'hc', en:`${O} hair is ${c.hc}.`, test:x=>x.g===c.g && x.hc===c.hc, key:[O,c.hc] },
    { k:'s', en:`${P} is ${c.s}.`, test:x=>x.g===c.g && x.s===c.s, key:[P,c.s] }
  ];
}
function whyNot(clue, x){
  const gW = w => w==='he' ? 'laki-laki' : 'perempuan';
  const target = clue.en;
  if(!clue.test(Object.assign({}, x, {g:x.g}))){
    const pronG = /^(He|His)\b/.test(target) ? 'he' : 'she';
    if(x.g!==pronG) return `Petunjuk “${esc(target)}” memakai <b>${target.split(' ')[0]}</b> → tokohnya ${gW(pronG)}. ${esc(x.name)} ${gW(x.g)}.`;
    return `Petunjuk “${esc(target)}” tidak cocok dengan ${esc(x.name)}.`;
  }
  return '';
}
function startP2(){
  const m = MEETINGS[1]; newGame(2);
  const ROUNDS = 5; let ri = 0; const targets = shuffle(CAST).slice(0, ROUNDS);
  G.total = ROUNDS*4;
  const st = shell(m, 'Baca petunjuk. <b>Ketuk tokoh</b> yang tidak cocok untuk mencoretnya. Bila sudah yakin, tekan <b>Tebak!</b> lalu ketuk tokohnya. Makin sedikit petunjuk, makin banyak poin.', 'Read the clues. Cross out. Guess who it is.');
  function round(){
    const T = targets[ri];
    const clues = [{ k:'ident', en:'This is my friend.', test:()=>true }].concat(shuffle(clueSet(T)));
    let shown = 1, out = new Set(), guessing = false, over = false;
    function pts(){ return Math.max(1, 5 - shown); }
    function draw(newIdx){
      const left = CAST.filter(c=>!out.has(c.name)).length;
      st.innerHTML = `<div class="progress"><i style="width:${(ri+(over?1:0))/ROUNDS*100}%"></i></div>
      <div class="det">
        <div class="clues">
          <h4>Petunjuk — ronde ${ri+1} dari ${ROUNDS}</h4>
          <ol>${clues.map((c,i)=> i<shown ? `<li class="${i===newIdx?'new':''}"><span class="n">${i+1}</span>${sayBtn(c.en)}<span>${esc(c.en)}</span></li>` : `<li class="lock"><span class="n">${i+1}</span>petunjuk tersembunyi</li>`).join('')}</ol>
          <p class="pts">Poin bila tebakan tepat sekarang: <b>${pts()}</b> · Tokoh tersisa: <b>${left}</b></p>
          <div class="actions" style="margin-top:6px">
            ${over ? `<button class="btn" id="next">${ri<ROUNDS-1?'Ronde berikutnya':'Lihat hasil'}</button>` :
              `<button class="btn ghost" id="more" ${shown>=clues.length?'disabled':''}>Petunjuk berikutnya</button><button class="btn" id="guess">${guessing?'Batal menebak':'Tebak!'}</button>`}
          </div>
          <div id="fb"></div>
        </div>
        <div>
          <div class="cast ${guessing?'guess':''}">${CAST.map(c=>castCard(c)).join('')}</div>
          ${SIFAT_LEGEND}
        </div>
      </div>`;
      st.querySelectorAll('.cc').forEach(b=>{ if(out.has(b.dataset.n)) b.classList.add('out'); });
      if(over) markEnd();
      const more = st.querySelector('#more');
      if(more) more.onclick = ()=>{ if(shown<clues.length){ shown++; sfx.tick(); draw(shown-1); } };
      const gb = st.querySelector('#guess');
      if(gb) gb.onclick = ()=>{ guessing=!guessing; draw();
        if(guessing) st.querySelector('#fb').innerHTML = `<div class="feedback ok">Ketuk tokoh yang kamu tebak.</div>`; };
      st.querySelectorAll('.cc').forEach(b=>b.onclick=()=>{
        if(over) return;
        const n = b.dataset.n;
        if(!guessing){ out.has(n) ? out.delete(n) : out.add(n); b.classList.toggle('out'); const l = st.querySelector('.pts'); if(l) l.innerHTML = `Poin bila tebakan tepat sekarang: <b>${pts()}</b> · Tokoh tersisa: <b>${CAST.filter(c=>!out.has(c.name)).length}</b>`; return; }
        over = true; guessing = false;
        const x = castBy(n), ok = n===T.name;
        if(ok){ sfx.ok(); addPts(pts()); } else { sfx.bad(); G.mistakes++; addPts(0); }
        const reason = ok ? '' : (clues.slice(1, shown).map(c=>whyNot(c,x)).find(Boolean) || `Petunjuk berikutnya akan membedakannya: “${esc(clues.slice(1).find(c=>!c.test(x)).en)}”`);
        draw();
        const all = clueSet(T).map(c=>c.en);
        st.querySelector('#fb').innerHTML = `<div class="feedback ${ok?'ok':'bad'}">${ok?`Tepat! Dia <b>${esc(T.name)}</b>. +${pts()} poin.`:`Bukan ${esc(n)}. Jawabannya <b>${esc(T.name)}</b>. ${reason}`}</div>
          <div class="model"><p>This is my friend, ${esc(T.name)}.</p>${all.map(s=>`<p>${esc(s)}</p>`).join('')}</div>`;
        if(!ok){ const mb = st.querySelector(`.cc[data-n="${n}"]`); if(mb) mb.classList.add('miss'); }
      });
      const nx = st.querySelector('#next');
      if(nx) nx.onclick = ()=>{ ri++; ri<ROUNDS ? round() : result(m, {detail:`Poin <b>${G.score}</b> dari maksimal <b>${G.total}</b> (makin sedikit petunjuk, makin banyak poin)`}); };
    }
    function markEnd(){ st.querySelector(`.cc[data-n="${T.name}"]`).classList.add('win'); }
    draw();
  }
  round();
}
