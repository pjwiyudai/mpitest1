/* =========================================================
   P4 — DESCRIBE TO DRAW
   ========================================================= */
const HEIGHTW = ['tall','short'], SIFATW = ['kind','friendly','funny','smart'], TYPEW = ['long','short','curly'], COLW = ['black','brown','white'], EYEW = ['black','brown'];
const PRONW = ['he','she','his','her'];
function parseSentence(tokens, ctx, target){
  const T = tokens.map(x=>x.toLowerCase());
  const err = (msg)=>({ok:false, msg});
  if(!T.length) return err('Susun kalimat dulu dari kepingan kata.');
  /* --- but: menghubungkan dua bagian kalimat yang BERBEDA --- */
  const bi = T.indexOf('but');
  if(bi>=0){
    if(T.indexOf('but', bi+1)>=0) return err('Pakai <b>but</b> sekali saja dalam satu kalimat.');
    if(bi===0 || bi===T.length-1) return err('<b>but</b> diletakkan di antara dua bagian kalimat: Her hair is black, <b>but</b> her eyes are brown.');
    if(T[0]==='this') return err('<b>but</b> tidak dipakai di kalimat Identification.');
    if(PRONW.includes(T[bi+1])){
      const r1 = parseSentence(tokens.slice(0,bi), ctx, target);
      if(!r1.ok) return r1;
      const r2 = parseSentence(tokens.slice(bi+1), Object.assign({}, ctx, {g:r1.set.g}), target);
      if(!r2.ok) return r2;
      if((r1.set.h && r2.set.s) || (r1.set.s && r2.set.h)){ const ph = r1.set.h || r2.set.h;
        return err(`Hati-hati: <b>but</b> berarti “tetapi”. Kalimat ini terdengar seolah ${ID[ph]} itu kekurangan. Agar santun, pakai dua kalimat atau <b>and</b>.`); }
      const same = Object.keys(r2.set).filter(k=>k!=='g' && k in r1.set);
      if(same.length) return err('Kedua bagian membahas ciri yang sama. <b>but</b> dipakai untuk dua hal yang berbeda, misalnya warna rambut ↔ warna mata.');
      const lt = r1.text.replace(/\.$/,''), rt = r2.text.replace(/\.$/,'');
      return { ok:true, kind:'desc', set:Object.assign({}, r1.set, r2.set), text:`${lt}, but ${rt.charAt(0).toLowerCase()+rt.slice(1)}.` };
    }
    /* but di antara kata sifat/ciri */
    const L = T[bi-1], R = T[bi+1];
    if(SIFATW.includes(L) && SIFATW.includes(R)) return err(`<b>${L}</b> dan <b>${R}</b> sama-sama sifat baik — tidak bertentangan. Pakai <b>and</b>.`);
    if((HEIGHTW.includes(L) && SIFATW.includes(R)) || (SIFATW.includes(L) && HEIGHTW.includes(R))){ const ph = HEIGHTW.includes(L) ? L : R;
      return err(`Hati-hati: <b>but</b> berarti “tetapi”. “${L} but ${R}” terdengar seolah ${ID[ph]} itu kekurangan. Agar santun, tulis dua kalimat terpisah atau pakai <b>and</b>.`); }
    if(HEIGHTW.includes(L) && HEIGHTW.includes(R)) return err('Tinggi dan pendek tidak bisa sekaligus. Pilih salah satu.');
    return err('Untuk dua ciri yang sejalan pakai <b>and</b>. <b>but</b> dipakai untuk dua hal yang berbeda: Her hair is black, <b>but</b> her eyes are brown.');
  }
  const P = ctx.g==='he' ? 'He' : ctx.g==='she' ? 'She' : 'He/She';
  if(T[0]==='this'){
    if(T[1]!=='is' || T[2]!=='my') return err('Pola Identification: <b>This is my … , (nama).</b>');
    if(!['friend','sister','brother'].includes(T[3])) return err('Setelah <b>This is my</b> sebutkan hubungannya: friend / sister / brother.');
    if(T.length<5) return err(`Tambahkan nama di akhir: <b>This is my ${T[3]}, ${esc(target.name)}.</b>`);
    if(T.length>5) return err('Kalimat Identification cukup: This is my … , (nama).');
    if(tokens[4]!==target.name) return err('Nama tokoh belum tepat.');
    const g = T[3]==='sister' ? 'she' : T[3]==='brother' ? 'he' : null;
    if(g && ctx.g && g!==ctx.g) return err(`Tadi kamu memakai ${ctx.g==='he'?'he/his':'she/her'}, tapi ${T[3]} berarti ${g==='he'?'laki-laki':'perempuan'}. Tokohnya satu orang — samakan.`);
    if(ctx.identified) return err('Identification sudah ada. Sekarang tulis Description (ciri & sifat).');
    return { ok:true, kind:'ident', set:{ rel:T[3], name:tokens[4], g: g || ctx.g || null }, text:`This is my ${T[3]}, ${tokens[4]}.` };
  }
  if(!ctx.identified) return err('Aku belum tahu siapa dia. Kalimat pertama harus <b>Identification</b>: This is my … , (nama).');
  let g = null, set = {};
  if(T[0]==='he'||T[0]==='she'){
    g = T[0]; const v = T[1], rest = T.slice(2);
    if(!v) return err(`Lanjutkan: ${tokens[0]} is … / ${tokens[0]} has …`);
    if(v==='are') return err(`<b>${tokens[0]}</b> memakai <b>is</b>, bukan are.`);
    if(v==='have') return err(`<b>${tokens[0]}</b> memakai <b>has</b>, bukan have.`);
    if(v==='is'){
      if(rest.includes('hair')||rest.includes('eyes')) return err(`Rambut & mata itu <b>dimiliki</b>. Pakai has: <b>${tokens[0]} has … hair.</b>`);
      const adj = rest.filter(w=>w!=='and');
      if(!adj.length) return err(`Lengkapi: ${tokens[0]} is … (tall, short, kind …).`);
      if(rest[0]==='and' || rest[rest.length-1]==='and' || rest.join(' ').includes('and and')) return err('Letakkan <b>and</b> di antara dua kata sifat: She is kind and smart.');
      for(const a of adj){
        if(HEIGHTW.includes(a)) set.h = a;
        else if(SIFATW.includes(a)) set.s = a;
        else if(['long','curly'].includes(a)) return err(`<b>${a}</b> menjelaskan rambut. Tulis: <b>${tokens[0]} has ${a} hair.</b>`);
        else if(COLW.includes(a)) return err(`Warna apa? Rambut atau mata? Tulis: <b>${tokens[0]} has ${a} hair.</b>`);
        else return err('Setelah is, pakai kata sifat: tall, short, kind, friendly, funny, smart.');
      }
    } else if(v==='has'){
      const noun = rest[rest.length-1];
      if(noun!=='hair' && noun!=='eyes'){
        if(rest.length===1 && (HEIGHTW.includes(rest[0])||SIFATW.includes(rest[0]))) return err(`<b>${rest[0]}</b> bukan benda yang dimiliki. Pakai is: <b>${tokens[0]} is ${rest[0]}.</b>`);
        return err(`Setelah has, akhiri dengan bendanya: <b>… hair</b> atau <b>… eyes</b>.`);
      }
      const mods = rest.slice(0,-1).filter(w=>w!=='and');
      if(!mods.length) return err(`Seperti apa? Contoh: ${tokens[0]} has long black ${noun}.`);
      for(const a of mods){
        if(noun==='hair'){ if(TYPEW.includes(a)) set.hair=a; else if(COLW.includes(a)) set.hc=a; else return err(`<b>${a}</b> tidak menjelaskan rambut.`); }
        else { if(EYEW.includes(a)) set.eyes=a; else return err('Mata dijelaskan dengan warna: black / brown.'); }
      }
    } else return err(`Setelah ${tokens[0]} pakai <b>is</b> atau <b>has</b>.`);
  } else if(T[0]==='his'||T[0]==='her'){
    g = T[0]==='his' ? 'he' : 'she'; const noun = T[1], v = T[2], rest = T.slice(3);
    if(noun!=='hair' && noun!=='eyes') return err(`Setelah ${tokens[0]} sebutkan bendanya: <b>hair</b> atau <b>eyes</b>.`);
    if(!v) return err(`Lanjutkan: ${tokens[0]} ${noun} ${noun==='hair'?'is':'are'} …`);
    if(noun==='hair' && v!=='is') return err(`Hair (rambut) memakai <b>is</b>: ${tokens[0]} hair is …`);
    if(noun==='eyes' && v!=='are') return err(`Eyes (mata) lebih dari satu → pakai <b>are</b>: ${tokens[0]} eyes are …`);
    const adj = rest.filter(w=>w!=='and');
    if(!adj.length) return err('Sebutkan cirinya.');
    for(const a of adj){
      if(noun==='hair'){ if(TYPEW.includes(a)) set.hair=a; else if(COLW.includes(a)) set.hc=a; else return err(`<b>${a}</b> tidak menjelaskan rambut.`); }
      else { if(EYEW.includes(a)) set.eyes=a; else return err('Mata dijelaskan dengan warna: black / brown.'); }
    }
  } else return err('Aku tidak mengerti. Mulai kalimat dengan <b>This is my</b> / <b>He</b> / <b>She</b> / <b>His</b> / <b>Her</b>.');
  if(ctx.g && g!==ctx.g) return err(`Tadi kamu memakai ${ctx.g==='he'?'he/his':'she/her'}, sekarang ${g==='he'?'he/his':'she/her'}? Tokohnya satu orang — pakai kata ganti yang sama.`);
  set.g = g;
  let text = tokens.join(' ').replace(/ and /g,' and ') + '.';
  text = text.charAt(0).toUpperCase() + text.slice(1);
  return { ok:true, kind:'desc', set, text };
}
const P4_PRESETS = [ withRel(castBy('Rina'),'sister'), withRel(castBy('Rudi'),'brother'), withRel(castBy('Tika'),'friend'), withRel(castBy('Bayu'),'friend') ];
function startP4(){
  const m = MEETINGS[3]; newGame(4, {solo:true, noScore:true});
  const st = shell(m, 'Pilih tokoh target. Lalu susun kalimat dari kepingan kata. Robot hanya menggambar dari tulisanmu.', 'Write sentences. The robot draws only what you write.');
  function choose(){
    const saved = store.get('chars', []);
    st.innerHTML = `<div class="qcard"><p class="qnum">Pilih tokoh yang akan kamu deskripsikan</p>
      <div class="cast" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">${P4_PRESETS.map((c,i)=>`<button class="cc" data-p="${i}">${chibi(c)}<b>${esc(c.name)}</b></button>`).join('')}
      ${saved.map((c,i)=>`<button class="cc" data-s="${i}">${chibi(c)}<b>${esc(c.name)}</b><span class="hint" style="margin:0">buatanmu</span></button>`).join('')}</div>
      ${saved.length?'':'<p class="hint">Tokoh buatanmu di Character Maker (P1) juga akan muncul di sini.</p>'}</div>`;
    st.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>play(P4_PRESETS[+b.dataset.p]));
    st.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>play(Object.assign({rel:'friend'}, saved[+b.dataset.s])));
  }
  function play(target){
    G.start = Date.now();
    let accepted = [], ctx = { identified:false, g:null }, robo = {}, cur = [], confused = 0, msg = null;
    const BANK = [
      ['Siapa', ['This','is','my','friend','sister','brother', target.name]],
      ['Kata ganti', ['He','She','His','Her']],
      ['Kata kerja & sambung', ['is','are','has','have','and','but']],
      ['Benda', ['hair','eyes']],
      ['Ciri', ['tall','short','long','curly','black','brown','white']],
      ['Sifat', ['kind','friendly','funny','smart']]
    ];
    function compare(){
      const rows = [
        ['Identification di awal', ctx.identified ? 'ok' : 'wait', ctx.identified ? `This is my ${robo.rel}, ${robo.name}.` : 'belum ada'],
        ['He / She', robo.g ? (robo.g===target.g?'ok':'bad') : 'wait', robo.g ? (robo.g===target.g?Pr(robo):`robot: ${Pr(robo)}, target: ${Pr(target)}`) : 'belum disebut']
      ];
      [['Tinggi badan','h'],['Jenis rambut','hair'],['Warna rambut','hc'],['Mata','eyes'],['Sifat','s']].forEach(([lab,k])=>{
        rows.push([lab, robo[k] ? (robo[k]===target[k]?'ok':'bad') : 'wait', robo[k] ? (robo[k]===target[k]? VALWORD[robo[k]] + (k==='eyes'?' eyes':'') : `robot: ${VALWORD[robo[k]]}, target berbeda`) : 'belum disebut']);
      });
      return rows;
    }
    function draw(){
      const rows = compare();
      const descN = accepted.filter(a=>a.kind==='desc').length;
      const allOk = rows.every(r=>r[1]==='ok');
      const win = allOk && descN>=4;
      const roboT = Object.assign({ shirt:'#9DB3BC', skin:1 }, robo);
      st.innerHTML = `<div class="draw">
        <div class="pair">
          <div class="pc"><h5>Tokoh target</h5>${chibi(target)}<b>${esc(target.name)}</b></div>
          <div class="pc"><h5>Gambar robot</h5>${ctx.identified ? chibi(roboT) : chibi({}, {unknown:true})}<b>${ctx.identified ? esc(robo.name) : '?'}</b></div>
          <div class="cmp">${rows.map(r=>`<div><span class="st ${r[1]}">${r[1]==='ok'?'✓':r[1]==='bad'?'✗':'·'}</span><span><b>${r[0]}:</b> ${esc(r[2])}</span></div>`).join('')}
            <div><span class="st ${descN>=4?'ok':'wait'}">${descN>=4?'✓':'·'}</span><span><b>Kalimat Description:</b> ${descN} (minimal 4)</span></div></div>
        </div>
        <div>
          <div class="mytext"><h4>Teksku ${accepted.length?sayBtn(accepted.map(a=>a.text).join(' ')):''}</h4>
            ${accepted.length ? `<ol>${accepted.map(a=>`<li>${esc(a.text)}</li>`).join('')}</ol>` : '<p class="empty">Belum ada kalimat. Mulai dengan Identification.</p>'}
            ${accepted.length && !win ? `<div class="actions" style="margin-top:6px"><button class="btn ghost sm" id="undo">Hapus kalimat terakhir</button></div>`:''}
          </div>
          ${win ? `<div class="robo">${ROBOT('happy')}<div class="bubble">Gambarku sama dengan ${esc(target.name)}! Tulisanmu jelas dan runtut.</div></div>
              <div class="actions"><button class="btn" id="finish">Lihat hasil</button><button class="btn ghost" id="other">Coba tokoh lain</button></div>` : `
          <div class="line-build" id="lb">${cur.length ? cur.map((w,i)=>`<button class="tk" data-ci="${i}" aria-label="Hapus ${esc(w)}">${esc(w)}</button>`).join('') : '<span class="ph">Ketuk kepingan kata di bawah untuk menyusun kalimat…</span>'}</div>
          <div class="actions" style="margin-top:8px"><button class="btn" id="send" ${cur.length?'':'disabled'}>Kirim ke robot</button><button class="btn ghost sm" id="bk" ${cur.length?'':'disabled'}>⌫ Hapus kata</button><button class="btn ghost sm" id="clr" ${cur.length?'':'disabled'}>Kosongkan</button></div>
          <div class="robomsg">${msg ? `<div class="robo">${ROBOT(msg.bad?'sad':'happy')}<div class="bubble">${msg.text}</div></div>` : ''}</div>
          <div class="bank">${BANK.map(([lbl,ws])=>`<div class="row"><span class="lbl">${lbl}</span>${ws.map(w=>`<button class="tile" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>`).join('')}</div>`}
        </div></div>`;
      st.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{ if(cur.length<12){ cur.push(b.dataset.w); msg=null; } else msg={bad:true,text:'Kalimatnya terlalu panjang. Kirim dulu, atau hapus beberapa kata.'}; draw(); });
      const clr = st.querySelector('#clr'); if(clr) clr.onclick = ()=>{ cur=[]; msg=null; draw(); };
      st.querySelectorAll('.tk').forEach(b=>b.onclick=()=>{ cur.splice(+b.dataset.ci,1); draw(); });
      const bk = st.querySelector('#bk'); if(bk) bk.onclick = ()=>{ cur.pop(); draw(); };
      const send = st.querySelector('#send');
      if(send) send.onclick = ()=>{
        const r = parseSentence(cur, ctx, target);
        if(!r.ok){ confused++; sfx.bad(); msg = { bad:true, text:`Aku bingung… ${r.msg}<br><span class="hint">Perbaiki kalimatmu: ketuk kata yang salah untuk menghapusnya, atau tekan Kosongkan.</span>` }; draw(); return; }
        const before = JSON.stringify(robo);
        if(r.kind==='ident'){ ctx.identified = true; robo.rel = r.set.rel; robo.name = r.set.name; if(r.set.g){ robo.g = r.set.g; ctx.g = r.set.g; } }
        else { Object.keys(r.set).forEach(k=>{ robo[k] = r.set[k]; }); ctx.g = r.set.g; }
        accepted.push({ kind:r.kind, text:r.text, tokens:cur.slice() });
        cur = []; sfx.ok();
        const changedWrong = compare().filter(x=>x[1]==='bad').map(x=>x[0]);
        msg = { bad:false, text: `${sayBtn(r.text)} ` + (before===JSON.stringify(robo) ? 'Aku sudah tahu itu. Coba tulis ciri lain.' : changedWrong.length ? `Aku menggambar sesuai tulisanmu. Tapi bandingkan lagi: <b>${changedWrong.join(', ')}</b> berbeda dengan target.` : 'Siap! Aku menggambar sesuai tulisanmu.') };
        draw();
      };
      const undo = st.querySelector('#undo');
      if(undo) undo.onclick = ()=>{
        accepted.pop(); ctx = { identified:false, g:null }; robo = {};
        const keep = accepted; accepted = [];
        keep.forEach(a=>{ const r = parseSentence(a.tokens, ctx, target); if(r.ok){ if(r.kind==='ident'){ ctx.identified=true; robo.rel=r.set.rel; robo.name=r.set.name; if(r.set.g){robo.g=r.set.g; ctx.g=r.set.g;} } else { Object.assign(robo, r.set); ctx.g=r.set.g; } accepted.push(a); } });
        msg = null; draw();
      };
      const fin = st.querySelector('#finish');
      if(fin) fin.onclick = ()=>{ const stars = confused<=1?1 : confused<=3?0.7 : 0.4;
        result(m, { ratio: stars, detail:`Teks ${accepted.length} kalimat (1 Identification + ${descN} Description) · robot bingung ${confused}×`,
          note:`<span style="font-family:var(--en);font-weight:700;color:var(--navy)">${accepted.map(a=>esc(a.text)).join(' ')}</span>` }); };
      const oth = st.querySelector('#other'); if(oth) oth.onclick = choose;
    }
    draw();
  }
  choose();
}

/* =========================================================
   P5 — DESCRIBE & GUESS BATTLE
   ========================================================= */
function startP5(){
  const m = MEETINGS[4]; newGame(5);
  let pool = shuffle(CAST), secret = null, phase = 'ready', timeLeft = 60, rounds = 0, correct = 0, guessed = null, ticks = {a:false, b:false};
  const st = shell(m, 'Pembicara maju dan mengintip kartu rahasia (teman-teman tutup mata). Pembicara mendeskripsikan tokoh <b>tanpa menyebut nama</b>. Regunya menebak.', 'Describe the secret person. Your team guesses.');
  function frames(){ return `<details><summary class="hint" style="cursor:pointer">Bantuan pola kalimat</summary><div class="frames">
    <p>This is my friend. <em>(tanpa nama!)</em></p><p>He / She is … .</p><p>He / She has … hair.</p><p>His / Her eyes are … .</p><p>He / She is kind / friendly / funny / smart.</p>
    <p>His / Her hair is … , <b>but</b> his / her eyes are … . <em>(dua hal yang berbeda)</em></p></div></details>`; }
  function draw(){
    const team = G.teamMode ? `Regu ${G.turn?'B':'A'}` : 'Pembicara';
    let ctrl = '';
    if(phase==='ready') ctrl = `<h4>Ronde ${rounds+1} · ${team}</h4>
      <p>1. Pilih satu pembicara. Ia maju ke depan.</p><p>2. Teman-teman <b>tutup mata</b>.</p>
      <div class="actions"><button class="btn" id="peek">Intip kartu rahasia</button>${rounds?`<button class="btn ghost" id="end">Selesai & lihat hasil</button>`:''}</div>`;
    else if(phase==='talk') ctrl = `<h4>${team}: deskripsikan!</h4>
      <div class="timer ${timeLeft<=10?'low':''}" id="tm">${fmt(timeLeft*1000)}</div>
      <div class="rule">Mulai dengan <b>This is my friend.</b> (tanpa nama), lalu minimal 4 kalimat Description. Regu menebak dengan mengetuk tokoh.</div>
      <label class="tick"><input type="checkbox" data-t="a" ${ticks.a?'checked':''}><span>Kalimat pertama Identification <b>(+1)</b></span></label>
      <label class="tick"><input type="checkbox" data-t="b" ${ticks.b?'checked':''}><span>Menyebut minimal 4 ciri <b>(+1)</b></span></label>
      <p class="hint">Guru/kelas mencentang saat mendengarkan. Tebakan tepat <b>+2</b>.</p>
      ${frames()}`;
    else if(phase==='done'){
      const ok = guessed===secret.name;
      const desc = sentences(withRel(secret,'friend'));
      ctrl = `<h4>${ok?'Tepat!':'Belum tepat'}</h4>
        <div class="feedback ${ok?'ok':'bad'}">${ok?`Regu menebak <b>${esc(secret.name)}</b> dengan benar.`:`Tebakan: ${esc(guessed||'—')}. Tokoh rahasia: <b>${esc(secret.name)}</b>.`} Poin ronde ini: <b>${(ok?2:0)+(ticks.a?1:0)+(ticks.b?1:0)}</b></div>
        <div class="model"><p style="font-family:var(--font);font-weight:400;color:var(--muted);font-size:.85em">Contoh deskripsi ${sayBtn(desc.map(x=>x.en).join(' '))}</p>${desc.map(x=>`<p>${esc(x.en)}</p>`).join('')}</div>
        <div class="actions"><button class="btn" id="nextR">${pool.length?'Ronde berikutnya':'Lihat hasil'}</button><button class="btn ghost" id="end">Selesai</button></div>`;
    }
    st.innerHTML = `<div class="bt"><div class="ctrl">${ctrl}</div>
      <div><div class="cast ${phase==='talk'?'guess':''}">${CAST.map(c=>castCard(c)).join('')}</div>${SIFAT_LEGEND}</div></div>`;
    if(phase==='done'){ st.querySelector(`.cc[data-n="${secret.name}"]`).classList.add('win'); if(guessed && guessed!==secret.name) st.querySelector(`.cc[data-n="${guessed}"]`).classList.add('miss'); }
    const pk = st.querySelector('#peek'); if(pk) pk.onclick = peek;
    const en = st.querySelector('#end'); if(en) en.onclick = finish;
    st.querySelectorAll('[data-t]').forEach(c=>c.onchange=()=>{ ticks[c.dataset.t] = c.checked; });
    st.querySelectorAll('.cc').forEach(b=>b.onclick=()=>{ if(phase!=='talk') return; guessed = b.dataset.n; endRound(); });
    const nr = st.querySelector('#nextR'); if(nr) nr.onclick = ()=>{ if(!pool.length) return finish(); phase='ready'; ticks={a:false,b:false}; guessed=null; draw(); };
  }
  function peek(){
    secret = pool.pop();
    const ov = document.createElement('div'); ov.className='overlay';
    ov.innerHTML = `<div class="sheet"><p>Hanya untuk pembicara</p>${chibi(secret)}<h3>${esc(secret.name)}</h3><p>Ingat ciri-cirinya. Jangan sebut namanya!</p><div class="actions" style="justify-content:center"><button class="btn" id="hideS">Sudah ingat — mulai bicara</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelector('#hideS').focus();
    ov.querySelector('#hideS').onclick = ()=>{ ov.remove(); phase='talk'; timeLeft=60; draw(); startTimer(); };
  }
  function startTimer(){
    clearInterval(extraTimer);
    extraTimer = setInterval(()=>{
      timeLeft--; const el = document.getElementById('tm');
      if(el){ el.textContent = fmt(timeLeft*1000); el.classList.toggle('low', timeLeft<=10); }
      if(timeLeft<=10 && timeLeft>0) sfx.tick();
      if(timeLeft<=0){ clearInterval(extraTimer); if(el) el.textContent = 'Waktu habis — tebak!'; }
    }, 1000);
  }
  function endRound(){
    clearInterval(extraTimer);
    const ok = guessed===secret.name; rounds++; if(ok) correct++;
    ok ? sfx.ok() : sfx.bad();
    const pts = (ok?2:0)+(ticks.a?1:0)+(ticks.b?1:0);
    G.total += 4; addPts(pts, false);
    phase='done'; draw();
    if(G.teamMode){ G.turn = 1-G.turn; renderBoard(); }
  }
  function finish(){ clearInterval(extraTimer); if(!rounds){ home(); return; } result(m, { detail:`Ronde dimainkan: <b>${rounds}</b> · tebakan tepat: <b>${correct}</b>` }); }
  draw();
}

const START = {1:startP1, 2:startP2, 3:startP3, 4:startP4, 5:startP5};

/* ---- tombol putar/hentikan + penghitung (audio hanya lewat tombol) ---- */
const playCounts = new Map();
function paintPlay(b){
  const t = b.__text, playing = nowPlaying === t, n = playCounts.get(t) || 0;
  b.classList.toggle('playing', playing); b.setAttribute('aria-pressed', playing);
  b.textContent = playing ? '⏹ Hentikan' : (n ? '▶ Putar lagi' : '▶ ' + b.dataset.label);
  const c = b.parentNode && b.parentNode.querySelector('.plays'); if(c) c.textContent = n ? `Diputar ${n}×` : 'Belum diputar';
}

const FS_MSG = 'Mode layar penuh diblokir browser. Gunakan menu fullscreen browser/perangkat (misalnya F11 atau tombol layar penuh di PID).';
fsBtn.onclick = ()=>{
  const de = document.documentElement;
  const req = de.requestFullscreen || de.webkitRequestFullscreen;
  if(document.fullscreenElement || document.webkitFullscreenElement){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  if(!req){ toast(FS_MSG); return; }
  try{ const p = req.call(de); if(p && p.catch) p.catch(()=>toast(FS_MSG)); }catch(e){ toast(FS_MSG); }
};

/* ---- GitHub Pages: unduh offline, pasang aplikasi, service worker ---- */
function downloadSelf(){
  const name = 'MPI_TP_7_4_My_Family.html';
  fetch(location.href.split('#')[0], {cache:'no-cache'}).catch(()=>caches.match('./index.html')).then(r=>{ if(!r) throw 0; return r.text(); }).then(txt=>{
    const url = URL.createObjectURL(new Blob([txt], {type:'text/html'}));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('File tersimpan di folder Unduhan. Buka dengan Chrome untuk bermain tanpa internet.');
  }).catch(()=>toast('Gagal mengunduh. Coba lagi saat terhubung ke internet.'));
}

}

home();
